<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Library</h1>
    <button id="new-book-btn">Add New Book</button>
  </header>

  <!-- Modal Dialog for New Book Form -->
  <dialog id="book-dialog">
    <form id="book-form">
      <h2>Add a New Book</h2>
      
      <div>
        <label for="title">Title:</label>
        <input type="text" id="title" required>
      </div>

      <div>
        <label for="author">Author:</label>
        <input type="text" id="author" required>
      </div>

      <div>
        <label for="pages">Pages:</label>
        <input type="number" id="pages" min="1" required>
      </div>

      <div>
        <label for="read">Have you read it?</label>
        <input type="checkbox" id="read">
      </div>

      <menu>
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit">Submit</button>
      </menu>
    </form>
  </dialog>

  <!-- Book Container Grid -->
  <main id="library-container"></main>
    <script src="script.js" defer></script>
</body>
</html>
